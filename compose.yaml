# LAN-only deployment: app (Gunicorn, one SQLite owner) + Caddy (LAN HTTPS).
# The operator sets APP_HOST (LAN IP or hostname), APP_PORT and secrets in
# .env (see .env.example). No public proxy admin port is exposed.
name: supplies-tracker

services:
  app:
    image: ${IMAGE:-ghcr.io/example/supplies-tracker:${VERSION:-0.4.0}}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      APP_VERSION: ${VERSION:-0.4.0}
    volumes:
      - app-data:/app/data
      - app-backups:/app/data/backups
      - caddy-data:/caddy-data:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check --deploy 2>/dev/null || python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz/',timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    # Pinned Caddy release; serves LAN HTTPS only on the configured address.
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      APP_HOST: ${APP_HOST:-127.0.0.1}
      APP_PORT: ${APP_PORT:-8443}

volumes:
  app-data:
  app-backups:
  caddy-data:
  caddy-config:
