# LAN-only deployment: app (Gunicorn, one SQLite owner) + Caddy (LAN HTTPS).
# The operator sets APP_HOST (LAN IP or hostname), APP_PORT and secrets in
# .env (see .env.example). No public proxy admin port is exposed.
#
# Versioning is canonical: IMAGE_BASE (or legacy IMAGE) names the repository
# WITHOUT a tag; ${VERSION} is the single release pin. The running image is
# always IMAGE_BASE:VERSION and APP_VERSION inside the container always
# equals VERSION so /readyz reports the exact running release. Never put a
# tag in IMAGE_BASE/IMAGE; the tag always comes from VERSION.
name: supplies-tracker

services:
  app:
    image: ${IMAGE_BASE:-${IMAGE:-ghcr.io/example/supplies-tracker}}:${VERSION:-0.4.0}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_DB_PATH: /app/data/db.sqlite3
      APP_VERSION: ${VERSION:-0.4.0}
    volumes:
      - app-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/readyz/', headers={'X-Forwarded-Proto': 'https'}); print(urllib.request.urlopen(req, timeout=5).read().decode())\" | grep -q '\"ok\": true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    # Pinned Caddy release; serves LAN HTTPS only on the configured address.
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8443}:${APP_PORT:-8443}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      APP_HOST: ${APP_HOST:-127.0.0.1}
      APP_PORT: ${APP_PORT:-8443}

volumes:
  app-data:
  caddy-data:
  caddy-config:
