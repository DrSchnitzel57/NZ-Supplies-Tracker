# Isolated test Compose file: synthetic settings only, never production
# data/secrets. Used by `docker compose -f compose.test.yaml config` and the
# tests/deployment suite with throwaway volumes.
name: supplies-tracker-test

services:
  app:
    build: .
    image: supplies-tracker:test
    env_file: []
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: test-only-synthetic-secret-not-a-real-secret
      DJANGO_ALLOWED_HOSTS: app,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://app:8443
      DJANGO_DB_PATH: /app/data/db.sqlite3
      APP_VERSION: 0.0.0-test
      APP_HOST: 127.0.0.1
      APP_PORT: "8443"
    expose:
      - "8000"

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "127.0.0.1:18443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      APP_HOST: 127.0.0.1
      APP_PORT: "8443"
