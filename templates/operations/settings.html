{% extends "base.html" %}
{% block title %}System settings — Supplies Tracker{% endblock %}
{% block content %}
<h1>System settings</h1>
<p class="help">Administrator-only. No secrets are stored here.</p>
<form method="post">
{% csrf_token %}
<label>Site notice (shown to staff) <input name="site_notice" value="{{ settings.site_notice|default:'' }}" maxlength="500"></label>
<label>Default low-stock alert level for new items <input name="default_low_threshold" value="{{ settings.default_low_threshold|default:'0' }}" inputmode="numeric"></label>
<button type="submit">Save settings</button>
</form>
<p><a href="/admin-area/reset/">Destructive tools: full reset</a></p>
{% endblock %}
