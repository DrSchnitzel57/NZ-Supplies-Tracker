{% extends "base.html" %}
{% block title %}Confirm your password — MTC Supplies{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
<h1>Confirm your password</h1>
<p class="sub">Administration changes need a recent password check. It lasts 10 minutes.</p>
<form method="post" class="stack">
{% csrf_token %}
<input type="hidden" name="next" value="{{ next }}">
<label>Your password <input type="password" name="password" required autocomplete="current-password"></label>
<button type="submit" class="primary">Confirm identity</button>
</form>
<p class="help">This doesn’t keep you signed in for longer.</p>
</div></div>
{% endblock %}
