# The existing production image (Gunicorn + WhiteNoise, uid 10001).
# SQLite means exactly ONE pod may ever use the database:
#   replicas: 1 and strategy Recreate (the old pod is gone before the new
#   one starts). Do not add an HPA, raise replicas or use RollingUpdate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplies-tracker
  namespace: mtc-supplies
  labels:
    app.kubernetes.io/name: supplies-tracker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: supplies-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supplies-tracker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # imagePullSecrets:
      #   - name: ghcr-pull        # read-only pull credential for a private registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Pin an exact release; never :latest. APP_VERSION must equal the tag.
          image: ghcr.io/example/supplies-tracker:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: supplies-tracker-config
            - secretRef:
                name: supplies-tracker-secret
          env:
            - name: APP_VERSION
              value: "0.4.0"
          volumeMounts:
            - name: data
              mountPath: /app/data
          # Probes speak plain HTTP to the pod like the Compose healthcheck:
          # X-Forwarded-Proto marks them as HTTPS-terminated, and Host must be
          # an allowed host (the kubelet would otherwise send the pod IP and
          # Django would answer 400).
          readinessProbe:
            httpGet:
              path: /readyz/
              port: http
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: supplies-tracker-data
