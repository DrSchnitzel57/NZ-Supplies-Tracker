# SHAPE ONLY - do not apply this file as it is (kustomization.yaml leaves
# it out). Create the real secret with a random key instead:
#   kubectl -n mtc-supplies create secret generic supplies-tracker-secret \
#     --from-literal=DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
# The placeholder below is the app's development default, which the app
# deliberately refuses to start with when DJANGO_DEBUG=0 (fails closed).
apiVersion: v1
kind: Secret
metadata:
  name: supplies-tracker-secret
  namespace: mtc-supplies
type: Opaque
stringData:
  DJANGO_SECRET_KEY: dev-insecure-secret-key-change-me
