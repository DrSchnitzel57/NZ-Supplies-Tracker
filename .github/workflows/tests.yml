name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Django test suite (synthetic data only)
        run: |
          python manage.py test tests.foundation tests.auth tests.ledger tests.concurrency tests.workflows tests.transfers tests.seed_conversion tests.reports tests.admin_safety tests.deployment_security
      - name: Browser suite
        run: |
          python -m pytest tests/browser -q
      - name: Deployment suite
        run: |
          python -m pytest tests/deployment -q
      - name: Shell syntax
        run: |
          bash -n scripts/update.sh scripts/restore.sh
      - name: Compose config (synthetic)
        run: |
          docker compose -f compose.test.yaml config --quiet
