# Builds and (gated) publishes versioned private GHCR images.
# Publishing requires an explicit manual approval: the publish job only runs
# on version tags (vX.Y.Z) and in the private repository configured by the
# operator. No registry token is created during implementation; the host uses
# a separate read-only pull credential (`docker login ghcr.io` on the host).
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push; synthetic verification)
        run: |
          docker build -t supplies-tracker:test .
          docker run --rm supplies-tracker:test python manage.py check

  publish:
    # Gated: only on explicit version tags, never on branch pushes.
    # The operator must approve the release before pushing a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR (release token provided at publish time only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push pinned version
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
