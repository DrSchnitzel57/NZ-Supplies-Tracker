# Builds and (gated) publishes versioned private GHCR images.
# Publishing requires an explicit manual approval: the publish job only runs
# on version tags (vX.Y.Z) and in the private repository configured by the
# operator. No registry token is created during implementation; the host uses
# a separate read-only pull credential (`docker login ghcr.io` on the host).
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Chromium (browser suite needs a real browser)
        run: |
          python -m playwright install chromium --with-deps
      - name: Full test gates (all suites must pass before any image builds)
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
          python -m pytest tests/browser tests/deployment -q
      - name: Build image (no push; synthetic verification)
        run: |
          docker build -t supplies-tracker:test .
          docker run --rm -e DJANGO_SECRET_KEY=test-only-synthetic-secret-not-a-real-secret supplies-tracker:test python manage.py check

  publish:
    # Gated: only on explicit version tags, never on branch pushes, and only
    # after the full build+test gate above. The operator must approve the
    # release before pushing a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency (tag vX.Y.Z serves pin X.Y.Z)
        run: |
          test "${GITHUB_REF_NAME#v}" != "" || exit 1
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Log in to GHCR (release token provided at publish time only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push pinned version (both tag spellings)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ env.APP_VERSION }}
